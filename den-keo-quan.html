<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đèn kéo quân</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        color: #fff;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      .scene {
        width: 300px;
        height: 300px;
        perspective: 1000px;
      }

      .carousel {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
      }

      .carousel img {
        position: absolute;
        width: 200px;
        height: 200px;
        left: 50%;
        top: 50%;
        transform-style: preserve-3d;
        transform-origin: center;
        margin-left: -100px;
        margin-top: -100px;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="carousel" id="carousel">
        <img src="img/img01.jpg" />
        <img src="img/img02.jpg" />
        <img src="img/img03.jpg" />
        <img src="img/img04.jpg" />
        <img src="img/img05.jpg" />
        <img src="img/img06.jpg" />
      </div>
    </div>

    <script>
      const carousel = document.getElementById("carousel");
      const images = carousel.querySelectorAll("img");
      const total = images.length;
      const radius = 300;

      let angle = 0;
      let isRunning = true;

      images.forEach((img, i) => {
        const rotateAngle = (360 / total) * i;
        img.style.transform = `
        rotateY(${rotateAngle}deg)
        translateZ(${radius}px)
      `;

        img.addEventListener("mouseenter", () => (isRunning = false));
        img.addEventListener("mouseleave", () => (isRunning = true));
      });

      function rotate() {
        if (isRunning) {
          angle += 0.3;
          carousel.style.transform = `rotateY(${angle}deg)`;
        }
        requestAnimationFrame(rotate);
      }

      rotate();
    </script>
  </body>
</html>
